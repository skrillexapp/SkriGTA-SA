name: Build SkriGTA-SA APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.2.11394342 cmake;3.22.1'

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v -keystore app/release.jks -alias skrigta -keyalg RSA -keysize 2048 -validity 10000 -storepass SkriGTA2026 -keypass SkriGTA2026 -dname "CN=SkriGTA-SA, OU=Skriflix, O=Skriflix, L=Local, S=Local, C=CU"

      - name: Build Release APK
        env:
          RELEASE_STORE_FILE: release.jks
          RELEASE_STORE_PASSWORD: SkriGTA2026
          RELEASE_KEY_ALIAS: skrigta
          RELEASE_KEY_PASSWORD: SkriGTA2026
        run: |
          chmod +x gradlew
          ./gradlew assembleVer_releaseRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkriGTA-SA-apk
          path: app/build/outputs/apk/ver_release/release/*.apk
